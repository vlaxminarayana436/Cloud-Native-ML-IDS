services:
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.api
    container_name: ids_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/security_events.db
      FIREWALL_MODE: ALERT_ONLY
    volumes:
      - ./data:/data
    # Needed only if FIREWALL_MODE is changed to BLOCK_SOURCE_IP.
    cap_add:
      - NET_ADMIN

  sniffer-agent:
    build:
      context: ./sniffer-agent
      dockerfile: Dockerfile.sniffer
    container_name: ids_sniffer
    restart: unless-stopped
    depends_on:
      - backend-api
    environment:
      BACKEND_URL: http://backend-api:8000/api/v1/flows/process
      SNIFFER_MODE: simulate
      FIREWALL_MODE: ALERT_ONLY
    # Required only if live capture or iptables blocking is enabled.
    cap_add:
      - NET_RAW
      - NET_ADMIN

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
    container_name: ids_dashboard
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "3000:80"

networks:
  default:
    name: ids-network

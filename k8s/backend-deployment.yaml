# Demonstration only: one SQLite replica and ephemeral data. See docs/operations.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commander
spec:
  replicas: 1
  selector:
    matchLabels: {app: commander}
  template:
    metadata:
      labels: {app: commander}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: commander
          image: cloud-native-ml-ids/commander:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: DB_PATH, value: /data/security_events.db}
            - {name: MODEL_DIR, value: /app/models}
            - {name: FIREWALL_MODE, value: SIMULATE_BLOCK}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: events, mountPath: /data}
      volumes:
        - name: events
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commander
spec:
  type: ClusterIP
  selector: {app: commander}
  ports:
    - {name: http, port: 8000, targetPort: http}

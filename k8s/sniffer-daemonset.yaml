apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ids-sentinel
  labels:
    app: ids-sentinel
spec:
  selector:
    matchLabels:
      app: ids-sentinel
  template:
    metadata:
      labels:
        app: ids-sentinel
    spec:
      # The agent needs to see the node interface, as described in the paper.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: sentinel
          image: your-docker-hub-user/ids-sentinel:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend-api:8000/api/v1/flows/process
            - name: SNIFFER_MODE
              value: live
            - name: INTERFACE
              value: eth0
            # The backend uses ALERT_ONLY by default. Enable blocking only
            # after testing firewall scope carefully.
            - name: FIREWALL_MODE
              value: ALERT_ONLY
            - name: FLOW_TIMEOUT
              value: "2"
          securityContext:
            capabilities:
              add: ["NET_RAW", "NET_ADMIN"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

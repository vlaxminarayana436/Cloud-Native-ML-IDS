apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: {app: ids-dashboard}
  template:
    metadata:
      labels: {app: ids-dashboard}
    spec:
      containers:
        - name: dashboard
          image: cloud-native-ml-ids/dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ids-dashboard
spec:
  type: ClusterIP
  selector: {app: ids-dashboard}
  ports:
    - {name: http, port: 80, targetPort: http}

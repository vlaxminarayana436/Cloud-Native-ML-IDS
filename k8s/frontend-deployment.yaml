apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-dashboard
  labels:
    app: ids-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-dashboard
  template:
    metadata:
      labels:
        app: ids-dashboard
    spec:
      containers:
        - name: dashboard
          image: your-docker-hub-user/ids-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ids-dashboard
  labels:
    app: ids-dashboard
spec:
  type: LoadBalancer
  selector:
    app: ids-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
